# Prüft alle Händler aus config/haendler.json technisch (erreichbar, Shop-System, Bot-Schutz, robots.txt, Impressum).
# Läuft bei Änderungen an der Händlerliste und von Hand ("Run workflow"). Ändert nichts, liest nur.
name: Händler-Check

on:
  workflow_dispatch:
  push:
    paths:
      - config/haendler.json
      - src/haendler-pruefen.js
      - scripts/haendler-check.js

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
      - run: npm run haendler-check
