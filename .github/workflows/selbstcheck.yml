# Täglicher Selbstcheck: Läuft der GitHub-Wächter, meldet sich der Handy-Wächter, fallen Händler/Quellen aus?
# Push nur bei Problemen (sonntags kurzer Wochen-Check). Hält die geplanten Abläufe aktiv (60-Tage-Regel von GitHub).
# Prüft und berichtet nur – ändert nie Code.
name: Selbstcheck

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbstcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # nur zum Aktivhalten der geplanten Abläufe
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"

      - name: Selbstcheck
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/selbstcheck.js
