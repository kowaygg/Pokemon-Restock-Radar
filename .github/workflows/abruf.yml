# Shop-Wächter (Ersatz für den Handy-Wächter): fragt alle aktiven Händler ab und schickt Push-Meldungen.
# Geplant alle 5 Minuten – GitHub verzögert geplante Läufe oft (real ca. 15–50 Min.).
name: Abruf

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"

      - name: Letzten Stand laden
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: zustand-${{ github.run_id }}
          restore-keys: zustand-

      - name: Händler abfragen
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
        run: npm run abruf

      - name: Stand sichern
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: zustand-${{ github.run_id }}
