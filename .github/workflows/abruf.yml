# Shop-Wächter (Ersatz für den Handy-Wächter): fragt alle aktiven Händler ab, schickt Push-Meldungen
# und veröffentlicht die App (web/ + öffentlicher Datenauszug) auf GitHub Pages.
# Geplant alle 5 Minuten – GitHub verzögert geplante Läufe oft (real ca. 15–50 Min.).
name: Abruf

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"

      - name: Letzten Stand laden
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: zustand-${{ github.run_id }}
          restore-keys: zustand-

      - name: Händler abfragen
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: npm run abruf

      - name: Stand sichern
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: zustand-${{ github.run_id }}

      - name: App zusammenstellen
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/oeffentlich.json _site/data/

      - name: App-Dateien bündeln
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: veroeffentlichen
        continue-on-error: true # kurze GitHub-Störungen („artifact metadata failed“) → zweiter Versuch unten
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Kurz warten (zweiter Versuch)
        if: steps.veroeffentlichen.outcome == 'failure'
        run: sleep 45

      - name: Auf GitHub Pages veröffentlichen (zweiter Versuch)
        if: steps.veroeffentlichen.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
